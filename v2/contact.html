<style>
.cj{position:relative;height:700vh}
.cp{position:sticky;top:0;height:100vh;overflow:hidden}
#crk{position:absolute;left:0;top:0;width:110px;margin:-80px 0 0 -55px;will-change:transform}
#crk svg{display:block;width:100%;height:auto}
#crk .fl{transform-box:fill-box;transform-origin:50% 0}
#boom{position:absolute;width:200px;height:200px;margin:-100px 0 0 -100px;border-radius:50%;opacity:0;pointer-events:none;background:radial-gradient(circle,#fff 0%,#f5e6b8 25%,#d4af37 50%,rgba(212,175,55,0) 72%);z-index:3}
#ring{position:absolute;width:200px;height:200px;margin:-100px 0 0 -100px;border-radius:50%;opacity:0;pointer-events:none;border:6px solid #ffb35c;z-index:3}
#chars{position:absolute;left:0;right:0;bottom:2vh;display:flex;justify-content:center;align-items:flex-end;gap:2.5rem;opacity:0;visibility:hidden;z-index:2}
#chars svg{height:min(26vh,190px);width:auto;display:block}
.ast svg{transform-origin:50% 100%;animation:sway 1.6s ease-in-out infinite}
.stars{transform-box:view-box;transform-origin:50px 22px;animation:orbit 2s linear infinite}
#aw{transform-box:view-box;transform-origin:75px 68px;animation:wave .5s ease-in-out infinite alternate}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
@keyframes wave{from{transform:rotate(-25deg)}to{transform:rotate(35deg)}}
#banner{position:absolute;left:0;right:0;top:10vh;margin:0 auto;width:min(760px,90%);text-align:center;opacity:0;visibility:hidden;z-index:2}
#banner h1{margin-top:0}
.icons{display:flex;gap:1rem;justify-content:center;margin-top:1rem}
.icons a{display:flex;width:52px;height:52px;align-items:center;justify-content:center;border:1px solid #d4af37;border-radius:50%;transition:transform .35s,box-shadow .35s}
.icons a:hover{transform:translateY(-3px);box-shadow:0 0 22px rgba(255,179,92,.35)}
.icons svg{width:24px;height:24px}
#chint{position:absolute;left:0;right:0;bottom:6vh;text-align:center;color:#f2efe8;font-size:.85rem;letter-spacing:.16em;text-transform:uppercase}
@media(prefers-reduced-motion:reduce){
 *{animation:none!important;transition:none!important}
 .cj{height:auto}.cp{position:static;height:auto;overflow:visible;padding:2rem 0}
 #crk,#boom,#ring,#chint{display:none}
 #banner,#chars{position:static;opacity:1!important;visibility:visible!important;transform:none!important;margin:1rem auto}
}

<script>
(function(){
 var C=function(x){return Math.max(0,Math.min(1,x))};
 var sec=document.getElementById('cj'),rk=document.getElementById('crk'),fl=rk.querySelector('.fl'),
  boom=document.getElementById('boom'),ring=document.getElementById('ring'),
  chars=document.getElementById('chars'),ban=document.getElementById('banner'),hint=document.getElementById('chint');
 function run(){
  var W=innerWidth,H=innerHeight;
  var p=C(-sec.getBoundingClientRect().top/(sec.offsetHeight-H));
  var om=4*Math.PI,a=.7*W,b=a/om*1.6,x0=.12*W,y0=H*.55,gy=H*.8;
  var x,y,rot,fs,t,q;
  if(p<.45){
   t=p/.45;
   x=x0+a*t+b*Math.sin(om*t);y=y0+b*(Math.cos(om*t)-1);
   rot=Math.atan2(-b*om*Math.sin(om*t),a+b*om*Math.cos(om*t))*180/Math.PI+90;
   fs=1.3+.4*Math.sin(p*300);
  }else{
   q=C((p-.45)/.15);
   x=x0+a+W*.04*q;y=y0+(gy-y0)*q*q;
   rot=90+110*q+Math.sin(q*40)*12*q;fs=.5+.8*Math.abs(Math.sin(q*50));
  }
  rk.style.transform='translate('+x+'px,'+y+'px) rotate('+rot+'deg)';
  rk.style.opacity=p<.60?1:0;
  fl.style.transform='scaleY('+fs+')';

  var bp=C((p-.60)/.14),bx=x0+a+W*.04,env=Math.sin(Math.PI*Math.pow(bp,.6)),big=Math.max(W,H);
  boom.style.left=bx+'px';boom.style.top=gy+'px';
  boom.style.opacity=(bp>0&&bp<1)?env:0;
  boom.style.transform='scale('+(.2+bp*big/80)+')';
  ring.style.left=bx+'px';ring.style.top=gy+'px';
  ring.style.opacity=(bp>0&&bp<1)?env*.8:0;
  ring.style.transform='scale('+(.2+bp*big/50)+')';

  var ap=C((p-.66)/.08);
  chars.style.opacity=ap;chars.style.visibility=ap<.01?'hidden':'visible';
  chars.style.transform='translateY('+((1-ap)*30)+'px)';

  var bn=C((p-.78)/.10);
  ban.style.opacity=bn;ban.style.visibility=bn<.01?'hidden':'visible';
  ban.style.transform='translateY('+((1-bn)*24)+'px)';
  hint.style.opacity=1-C(p/.04);
 }
 addEventListener('scroll',run,{passive:true});addEventListener('resize',run);run();
})();
</script>
