<script>
(function(){
 var C=function(x){return Math.max(0,Math.min(1,x))},D=180/Math.PI;
 var K=function(x){return Math.max(-1,Math.min(1,x))};
 var $=function(i){return document.getElementById(i)};
 var sec=$('cj'),cp=sec.querySelector('.cp'),rk=$('crk'),fl=rk.querySelector('.fl'),boom=$('boom'),ring=$('ring'),chars=$('chars'),
  ban=$('banner'),hint=$('chint'),pls=$('planets'),mars=$('mars'),ins=$('inside'),gr=$('ground'),run=$('runner'),wm=$('wmars'),mor=$('mor');
 var a1=$('ali1'),eggs=[].slice.call(document.querySelectorAll('.cam'));
 var wf=document.createElement('div');
 wf.style.cssText='position:absolute;left:0;top:0;right:0;bottom:0;background:#fff;opacity:0;z-index:8;pointer-events:none';
 cp.appendChild(wf);
 var sparks=[];
 for(var s=0;s<18;s++){var sd=document.createElement('div');sd.className='spark';cp.appendChild(sd);sparks.push(sd);}
 [.18,.36].forEach(function(d,i){var c=a1.cloneNode(true);c.id='ali'+(i+2);
  [].forEach.call(c.querySelectorAll('.al,.ar'),function(g){g.style.animationDelay=(-d)+'s'});
  c.querySelector('svg').style.height='min('+(i?19:23)+'vh,'+(i?135:165)+'px)';
  chars.appendChild(c);});
 var legs=['ruL','ruR','raL','raR'].map($);
 function frame(){
  var W=innerWidth,H=innerHeight;
  var p=C(-sec.getBoundingClientRect().top/(sec.offsetHeight-H));
  var x,y,rot,fs=0,show=0;
  var om=4*Math.PI,a=.6*W,b=a/om*1.6,x0=.12*W,y0=H*.55;
  if(p<.35){
   var t=p/.35;
   x=x0+a*t+b*Math.sin(om*t);y=y0+b*(Math.cos(om*t)-1);
   rot=Math.atan2(-b*om*Math.sin(om*t),a+b*om*Math.cos(om*t))*D+90;
   fs=Math.max(0,1.6*(1-C(t/.92)))*(.8+.2*Math.abs(Math.sin(p*300)));
   show=1;
  }
  var mr=Math.min(W,H)*.45,mx=W*.8,my=H*.62,tx=mx-mr*.8,ty=my+mr*.25;
  if(p>=.55&&p<.67){
   var q=C((p-.55)/.12),sx=-.1*W,sy=.2*H;
   x=sx+(tx-sx)*q;y=sy+(ty-sy)*q*q;
   rot=Math.atan2(2*(ty-sy)*q,tx-sx)*D+90+Math.sin(q*30)*8;fs=.001;show=1;
  }
  rk.style.opacity=show;
  if(show){rk.style.transform='translate('+x+'px,'+y+'px) rotate('+rot+'deg)';fl.style.transform='scaleY('+fs+')';}

  pls.style.transform='translateX('+(-2*W*C(p/.35))+'px)';
  pls.style.opacity=1-C((p-.35)/.03);

  ins.style.opacity=C((p-.36)/.03)*(1-C((p-.54)/.03));
  var ft=(p-.36)*60;
  var fx=W*.5+Math.sin(ft*.9)*W*.26-run.offsetWidth/2;
  var fy=Math.sin(ft*1.3)*H*.06;
  run.style.transform='translate('+fx+'px,'+fy+'px)';
  run.querySelector('svg').style.transform='rotate('+(Math.sin(ft*.7)*24+Math.sin(ft*.31)*14)+'deg)';
  legs[0].style.transform='rotate('+(8+Math.sin(ft*1.1)*12)+'deg)';
  legs[1].style.transform='rotate('+(-8+Math.sin(ft*1.1+1.6)*12)+'deg)';
  legs[2].style.transform='rotate('+(-25+Math.sin(ft*.9)*14)+'deg)';
  legs[3].style.transform='rotate('+(25+Math.sin(ft*.9+2)*14)+'deg)';
  if(wm){wm.style.transform='scale('+(.3+1.6*C((p-.36)/.19))+')';}

  mars.style.opacity=C((p-.54)/.03)*(1-C((p-.72)/.03));
  mars.style.transform='scale('+(.3+.7*C((p-.54)/.11))+')';

  var bp=C((p-.67)/.12),env=Math.sin(Math.PI*Math.pow(bp,.6)),big=Math.max(W,H);
  boom.style.left=tx+'px';boom.style.top=ty+'px';
  boom.style.opacity=(bp>0&&bp<1)?env:0;boom.style.transform='scale('+(.2+bp*big/80)+')';
  ring.style.left=tx+'px';ring.style.top=ty+'px';
  ring.style.opacity=(bp>0&&bp<1)?env*.8:0;ring.style.transform='scale('+(.2+bp*big/50)+')';
  wf.style.opacity=(bp>0&&bp<1)?Math.max(0,.9*(1-Math.abs(bp-.12)/.12)):0;
  var sh=(bp>0&&bp<.35)?1-bp/.35:0;
  cp.style.transform='translate('+(Math.sin(p*3000)*8*sh)+'px,'+(Math.cos(p*2700)*8*sh)+'px)';
  sparks.forEach(function(el,i){
   var ang=i/sparks.length*2*Math.PI,d=bp*big*(.22+.14*(i%3));
   el.style.left=(tx+Math.cos(ang)*d)+'px';el.style.top=(ty+Math.sin(ang)*d+80*bp*bp)+'px';
   el.style.opacity=(bp>0&&bp<1)?C(bp*8)*(1-bp):0;
  });

  var ep=C((p-.68)/.16);
  eggs.forEach(function(el,i){
   var ang=(-150+i*40)*Math.PI/180,dist=ep*big*(.28+.06*(i%2));
   var ex=tx+Math.cos(ang)*dist,ey=ty+Math.sin(ang)*dist+260*ep*ep;
   el.style.opacity=C(ep*6)*(1-C((ep-.75)/.25));
   el.style.transform='translate('+ex+'px,'+ey+'px) translate(-50%,-50%)';
   el.firstElementChild.style.transform='rotate('+((i%2?1:-1)*300*ep)+'deg)';
  });

  gr.style.opacity=C((p-.70)/.04);
  var ap=C((p-.74)/.06);
  chars.style.opacity=ap;chars.style.visibility=ap<.01?'hidden':'visible';
  var u=C((p-.78)/.22)*4*Math.PI,amp=Math.max(40,(W-580)/2-20)*C((p-.78)/.04);
  chars.style.transform='translate('+(Math.sin(u)*amp)+'px,'+((1-ap)*30)+'px) scaleX('+K(Math.cos(u)*3)+')';
  var mo=C((p-.80)/.03);
  mor.style.opacity=mo;mor.style.visibility=mo<.01?'hidden':'visible';
  mor.style.transform='translate('+(W/2+Math.sin(u-.7)*amp-mor.offsetWidth/2)+'px,0) scaleX('+K(Math.cos(u-.7)*3)+')';

  var bn=C((p-.86)/.08);
  ban.style.opacity=bn;ban.style.visibility=bn<.01?'hidden':'visible';
  ban.style.transform='translateY('+((1-bn)*24)+'px)';
  if(hint)hint.style.opacity=1-C(p/.03);
 }
 addEventListener('scroll',frame,{passive:true});addEventListener('resize',frame);frame();
})();
</script>
