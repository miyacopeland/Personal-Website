<style>
.cj{position:relative;height:1000vh}
.cp{position:sticky;top:0;height:100vh;overflow:hidden}
.cp>*{position:absolute}
#planets{inset:0;will-change:transform}
.pl{position:absolute;border-radius:50%}
.moon{left:62vw;top:62vh;width:8vmin;height:8vmin;background:radial-gradient(circle at 35% 30%,#e8e6e1,#8a8f9a 70%)}
.earth{left:100vw;top:16vh;width:24vmin;height:24vmin;background:radial-gradient(circle at 30% 30%,#7fd0ff,#1f5fbf 60%,#0a1f55);box-shadow:inset -14px -10px 30px rgba(0,0,0,.5),0 0 40px rgba(111,170,255,.35)}
.earth::before{content:"";position:absolute;left:22%;top:25%;width:34%;height:28%;border-radius:50% 40% 55% 45%;background:#4cae6a;box-shadow:30px 38px 0 -4px #4cae6a}
.jup{left:150vw;top:50vh;width:38vmin;height:38vmin;overflow:hidden;background:repeating-linear-gradient(180deg,#c9a27a 0 8%,#e9d3ad 8% 15%,#b57f55 15% 21%,#f0dfc0 21% 30%);box-shadow:inset -24px -16px 50px rgba(0,0,0,.55)}
.sat{left:205vw;top:16vh;width:20vmin;height:20vmin;background:radial-gradient(circle at 35% 30%,#f2dfae,#c9a766 70%);box-shadow:inset -12px -8px 24px rgba(0,0,0,.5)}
.sat::before{content:"";position:absolute;left:-45%;right:-45%;top:38%;bottom:38%;border:5px solid rgba(235,214,160,.8);border-radius:50%;transform:rotate(-18deg)}
#mars{width:min(90vw,90vh);height:min(90vw,90vh);left:calc(80vw - min(45vw,45vh));top:calc(62vh - min(45vw,45vh));border-radius:50%;opacity:0;background:radial-gradient(circle at 30% 28%,#e08a58,#b04a22 55%,#5e220f);box-shadow:inset -40px -30px 90px rgba(0,0,0,.55),0 0 80px rgba(224,120,70,.25)}
#mars::before{content:"";position:absolute;left:25%;top:40%;width:22%;height:14%;border-radius:50%;background:rgba(80,25,10,.4);box-shadow:120px -70px 0 -6px rgba(80,25,10,.35),40px 90px 0 -2px rgba(80,25,10,.3)}
#inside{inset:0;opacity:0;z-index:4;background:radial-gradient(ellipse at 50% 38%,#8a1414,#3a0707 65%,#1a0303);overflow:hidden}
#inside .wall{position:absolute;left:0;right:0;top:0;height:76%;background:repeating-linear-gradient(90deg,rgba(0,0,0,.18) 0 2px,transparent 2px 140px)}
#inside .floor{position:absolute;left:0;right:0;bottom:0;height:24%;background:linear-gradient(#2a0505,#120202);border-top:2px solid rgba(255,120,120,.4)}
#inside .flash{position:absolute;inset:0;background:#ff2a2a;animation:alarm .7s ease-in-out infinite}
#inside .lamp{position:absolute;top:3vh;width:34px;height:34px;border-radius:50%;background:#ff4040;box-shadow:0 0 40px 14px rgba(255,64,64,.8);animation:alarm .7s ease-in-out infinite}
#inside .l1{left:2%}#inside .l2{right:2%;animation-delay:.35s}
@keyframes alarm{0%,100%{opacity:.12}50%{opacity:.6}}
@keyframes bl{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes rf{0%,100%{opacity:.05}50%{opacity:.4}}
@keyframes bob{0%,100%{transform:translateY(-8px)}50%{transform:translateY(8px)}}
#runner{position:absolute;left:0;top:22vh;width:min(18vh,150px);margin:0;z-index:2}
#runner .bob{animation:bob 4.5s ease-in-out infinite}
#runner svg{display:block;width:100%;height:auto;transform-origin:50% 50%}
#ruL,#ruR,#raL,#raR{transform-box:view-box}
#ruL{transform-origin:40px 108px}#ruR{transform-origin:60px 108px}
#raL{transform-origin:18px 62px}#raR{transform-origin:82px 62px}
.blink{animation:bl .7s infinite}.rf{animation:rf .7s infinite}
#crk{left:0;top:0;width:110px;margin:-80px 0 0 -55px;will-change:transform;z-index:2}
#crk svg{display:block;width:100%;height:auto}
#crk .fl{transform-box:fill-box;transform-origin:50% 0}
#boom{width:200px;height:200px;margin:-100px 0 0 -100px;border-radius:50%;opacity:0;pointer-events:none;background:radial-gradient(circle,#fff 0%,#f5e6b8 25%,#d4af37 50%,rgba(212,175,55,0) 72%);z-index:6}
#ring{width:200px;height:200px;margin:-100px 0 0 -100px;border-radius:50%;opacity:0;pointer-events:none;border:6px solid #ffb35c;z-index:6}
#ground{inset:0;opacity:0;z-index:1;background:linear-gradient(180deg,#1a0d0a 0%,#5a2416 55%,#7d341c 73.9%,#a04524 74%,#7a3118 100%)}
#ground::before{content:"";position:absolute;left:8%;bottom:6%;width:90px;height:26px;border-radius:50%;background:rgba(60,20,8,.35);box-shadow:520px -10px 0 6px rgba(60,20,8,.3)}
#chars{left:0;right:0;bottom:2vh;display:flex;justify-content:center;align-items:flex-end;gap:.9rem;opacity:0;visibility:hidden;z-index:3;transform-origin:50% 100%}
#chars svg{height:min(17vh,130px);width:auto;display:block}
#chars .bbt svg{height:min(13vh,100px)}
.flag{transform-box:view-box;transform-origin:92px 18px;animation:flut .6s ease-in-out infinite alternate}
.al,.ar{transform-box:view-box}
.al{transform-origin:28px 76px;animation:wl .55s ease-in-out infinite alternate}
.ar{transform-origin:72px 76px;animation:wr .55s ease-in-out infinite alternate}
@keyframes flut{from{transform:scaleX(.8) skewY(-4deg)}to{transform:scaleX(1.1) skewY(4deg)}}
@keyframes wl{from{transform:rotate(-22deg)}to{transform:rotate(-48deg)}}
@keyframes wr{from{transform:rotate(22deg)}to{transform:rotate(48deg)}}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes munch{0%,100%{transform:translateY(0)}50%{transform:translateY(3px)}}
#chars .ast,#chars .ali,#chars .bbt{animation:hop .45s ease-in-out infinite}
#chars.stand .ast,#chars.stand .ali,#chars.stand .bbt{animation:none}
#chars.sit .ast,#chars.sit .ali,#chars.sit .bbt{animation:munch .7s ease-in-out infinite}
#banner{left:0;right:0;top:8vh;margin:0 auto;width:min(760px,90%);text-align:center;opacity:0;visibility:hidden;z-index:5}
#banner h1{margin-top:0}
.icons{display:flex;gap:1rem;justify-content:center;margin-top:1rem}
.icons a{display:flex;width:52px;height:52px;align-items:center;justify-content:center;border:1px solid #d4af37;border-radius:50%;transition:transform .35s,box-shadow .35s}
.icons a:hover{transform:translateY(-3px);box-shadow:0 0 22px rgba(255,179,92,.35)}
.icons svg{width:24px;height:24px}
#chint{left:0;right:0;bottom:6vh;text-align:center;color:#f2efe8;font-size:.85rem;letter-spacing:.16em;text-transform:uppercase;z-index:2}
#eggs{inset:0;z-index:7;pointer-events:none}
.spark{position:absolute;left:0;top:0;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:#ffb35c;box-shadow:0 0 10px 2px #ffb35c;opacity:0;z-index:6;pointer-events:none}
#inside .wind{position:absolute;left:50%;top:7vh;width:min(780px,84%);height:34vh;transform:translateX(-50%);border-radius:50% 50% 12% 12%/60% 60% 12% 12%;border:8px solid #3a1010;box-shadow:0 0 0 3px #d4af37,inset 0 0 40px #000;overflow:hidden;background:#05060a}
.wstars{position:absolute;inset:0;background-image:radial-gradient(1.5px 1.5px at 20% 30%,#fff,transparent),radial-gradient(1px 1px at 60% 20%,#fff,transparent),radial-gradient(1.5px 1.5px at 80% 60%,#fff,transparent),radial-gradient(1px 1px at 35% 70%,#fff,transparent),radial-gradient(1px 1px at 50% 45%,#fff,transparent)}
#wmars{position:absolute;right:12%;top:30%;width:22vmin;height:22vmin;border-radius:50%;background:radial-gradient(circle at 30% 28%,#e08a58,#b04a22 55%,#5e220f);box-shadow:0 0 40px rgba(224,120,70,.45)}
#inside .over{position:absolute;left:50%;top:0;width:min(780px,84%);transform:translateX(-50%);display:flex;justify-content:space-around;padding:6px 14px;background:#1a0505;border:2px solid rgba(255,120,120,.35);border-top:0;border-radius:0 0 12px 12px}
#inside .over i{width:14px;height:8px;border-radius:2px;background:#ff4040;animation:bl .7s infinite}
#inside .over i:nth-child(even){animation-delay:.35s;background:#d4af37}
#inside .dash{position:absolute;left:50%;bottom:24%;width:min(900px,96%);transform:translateX(-50%)}
#inside .dash svg{display:block;width:100%;height:auto}
.cam{position:absolute;left:0;top:0;opacity:0;text-align:center;color:#f5f1e8;font-size:.7rem;letter-spacing:.08em;white-space:nowrap}
.cam svg{display:block;width:clamp(44px,7vw,70px);height:auto;margin:0 auto .2rem}
.cam b{font-weight:500;background:rgba(10,21,48,.85);border:1px solid rgba(212,175,55,.6);border-radius:999px;padding:.1rem .5rem}
#mor{left:0;bottom:5vh;width:min(24vh,190px);opacity:0;visibility:hidden;z-index:2;pointer-events:none}
#mor svg{display:block;width:100%;height:auto;overflow:visible;animation:hop .4s ease-in-out infinite}
#mor.stand svg{animation:none}
#msit{left:0;bottom:5vh;width:min(44.8vh,355px);opacity:0;visibility:hidden;z-index:2;pointer-events:none}
#msit svg{display:block;width:100%;height:auto;overflow:visible}
#feast{left:0;bottom:.5vh;width:min(700px,90vw);opacity:0;visibility:hidden;z-index:4;pointer-events:none}
#feast svg{display:block;width:100%;height:auto}
#ship{left:calc(50% - min(9vh,64px));bottom:17vh;width:min(18vh,128px);z-index:1;visibility:hidden;pointer-events:none}
#ship svg{display:block;width:100%;height:auto;overflow:visible}
#clk{left:0;top:0;width:38px;opacity:0;z-index:4;pointer-events:none}
#clk svg{display:block;width:100%;height:auto}
nav{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(10,21,48,.88);backdrop-filter:blur(6px)}
@media(prefers-reduced-motion:reduce){
 *{animation:none!important;transition:none!important}
 .cj{height:auto}.cp{position:static;height:auto;overflow:visible;padding:2rem 0}
 .cp>*{position:static}
 #planets,#mars,#inside,#ground,#crk,#boom,#ring,#chint,#eggs,#mor,#msit,#feast,#ship,#clk{display:none}
 #banner,#chars{opacity:1!important;visibility:visible!important;transform:none!important;margin:1rem auto}
}

  legs[0].style.transform='rotate('+(8+Math.sin(ft*1.1)*12)+'deg)';

  legs[2].style.transform='rotate('+(-25+Math.sin(ft*.9)*14)+'deg)';
  legs[3].style.transform='rotate('+(25+Math.sin(ft*.9+2)*14)+'deg)';
  if(wm){wm.style.transform='scale('+(.3+1.6*C((p-.36)/.19))+')';}

  mars.style.opacity=C((p-.54)/.03)*(1-C((p-.72)/.03));
  mars.style.transform='scale('+(.3+.7*C((p-.54)/.11))+')';

  var bp=C((p-.67)/.12),env=Math.sin(Math.PI*Math.pow(bp,.6)),big=Math.max(W,H);
  boom.style.left=tx+'px';boom.style.top=ty+'px';
  boom.style.opacity=(bp>0&&bp<1)?env:0;boom.style.transform='scale('+(.2+bp*big/80)+')';
  ring.style.left=tx+'px';ring.style.top=ty+'px';
  ring.style.opacity=(bp>0&&bp<1)?env*.8:0;ring.style.transform='scale('+(.2+bp*big/50)+')';
  wf.style.opacity=(bp>0&&bp<1)?Math.max(0,.9*(1-Math.abs(bp-.12)/.12)):0;
  var sh=(bp>0&&bp<.35)?1-bp/.35:0;
  cp.style.transform='translate('+(Math.sin(p*3000)*8*sh)+'px,'+(Math.cos(p*2700)*8*sh)+'px)';
  sparks.forEach(function(el,i){
   var ang=i/sparks.length*2*Math.PI,d=bp*big*(.22+.14*(i%3));
   el.style.left=(tx+Math.cos(ang)*d)+'px';el.style.top=(ty+Math.sin(ang)*d+80*bp*bp)+'px';
   el.style.opacity=(bp>0&&bp<1)?C(bp*8)*(1-bp):0;
  });

  var ep=C((p-.68)/.12);
  eggs.forEach(function(el,i){
   var ang=(-150+i*40)*Math.PI/180,dist=ep*big*(.28+.06*(i%2));
   var ex=tx+Math.cos(ang)*dist,ey=ty+Math.sin(ang)*dist+260*ep*ep;
   el.style.opacity=C(ep*6)*(1-C((ep-.75)/.25));
   el.style.transform='translate('+ex+'px,'+ey+'px) translate(-50%,-50%)';
   el.firstElementChild.style.transform='rotate('+((i%2?1:-1)*300*ep)+'deg)';
  });

  gr.style.opacity=C((p-.70)/.04);

  var bn=C((p-.86)/.08);
  ban.style.opacity=bn;ban.style.visibility=bn<.01?'hidden':'visible';
  ban.style.transform='translateY('+((1-bn)*24)+'px)';
  if(hint)hint.style.opacity=1-C(p/.03);
 }

 function tick(now){
  var W=innerWidth,H=innerHeight,amp=Math.max(30,(W-720)/2-20),L=1.7;
  var sx=-Math.min(130,Math.max(0,(W-900)/2));
  if(P<.70){t0=null;done=false;}
  else if(P>=.80&&t0===null&&!done)t0=now;
  var T=done?20:(t0===null?-1:(now-t0)/1000);
  if(!done&&T>10.2){done=true;T=20;}

  var ap=C((P-.74)/.06),Tg=Math.max(T,0);
  var face=Tg<3.6?K(6*(2.4-Tg)):K(6*(Tg-4.8));
  var sit=C((T-9.3)/.5);
  chars.classList.toggle('stand',T>=7&&T<9.3);
  chars.classList.toggle('sit',T>=9.3);
  chars.style.opacity=ap;
  chars.style.visibility=ap<.01?'hidden':'visible';
  chars.style.transform='translate('+gx(Tg,amp,sx)+'px,'+((1-ap)*30)+'px) scale('+face+','+(1-.22*sit)+')';

  var mw=msit.offsetWidth||355;
  var Mx=Math.min(sx+345+.46*mw+95,W/2-110);
  var hitX=gx(3.9,amp,sx),mxv,mf,rotm=0,dz=false;
  if(T<5.6){var Tm=T-L;mxv=gx(Tm,amp,sx);mf=Tm<3.6?K(6*(2.4-Tm)):K(6*(Tm-4.8));}
  else if(T<7.6){mxv=hitX;mf=-1;dz=true;rotm=Math.sin(T*9)*7;}
  else if(T<9){mxv=hitX*(1-C((T-7.6)/.7));mf=K(6*(T-7.7));}
  else{mxv=Mx*C((T-9)/.7);mf=K(6*(T-7.7))*(1-2*C((T-9.4)/.1));}
  var jy=(T>8.3&&T<9)?-Math.sin((T-8.3)/.7*Math.PI)*110:0;
  var mo=T<0?0:1-C((T-9.5)/.2);
  mor.classList.toggle('stand',dz);
  mor.style.opacity=mo;mor.style.visibility=mo<.01?'hidden':'visible';
  mor.style.transform='translate('+(W/2+mxv-mor.offsetWidth/2)+'px,'+jy+'px) rotate('+rotm+'deg) scale('+(mf*.92)+',.92)';
  mst.style.opacity=dz?1:0;

  var so=(done?1:(T<9.5?0:C((T-9.5)/.3)))*ap;
  msit.style.opacity=so;msit.style.visibility=so<.01?'hidden':'visible';
  msit.style.transform='translate('+(W/2+Mx-.73*mw)+'px,0) scaleX(-1)';

  var fo=(done?1:C((T-9.3)/.5))*ap,fw=feast.offsetWidth||700;
  feast.style.opacity=fo;feast.style.visibility=fo<.01?'hidden':'visible';
  feast.style.transform='translate('+(W/2+sx-fw/2)+'px,0)';

  var s=C((T-2.6)/2);
  var sy=T<2.6?-(H+400):(T<7.6?-(H+400)*Math.pow(1-s,3):-Math.pow(T-7.6,2)*520);
  ship.style.visibility=(T>=2.5&&T<9.4)?'visible':'hidden';
  ship.style.transform='translateY('+sy+'px)';
  sfl.style.opacity=((T>=2.6&&T<4.8)||(T>=7.5&&T<9.4))?1:0;

  var cu=C((T-5)/.6),sx0=W/2-amp-152,sy0=H*.98-110,ex=W/2+hitX,ey=H*.95-90;
  clk.style.opacity=(T>=5&&T<5.6)?1:0;
  clk.style.transform='translate('+(sx0+(ex-sx0)*cu)+'px,'+(sy0+(ey-sy0)*cu-Math.sin(Math.PI*cu)*H*.18)+'px) translate(-50%,-50%) rotate('+(cu*720)+'deg)';

  requestAnimationFrame(tick);
 }

 addEventListener('scroll',frame,{passive:true});addEventListener('resize',frame);
 frame();requestAnimationFrame(tick);
})();
</script>
